<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RPGJS Game</title>
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no, minimum-scale=1, width=device-width, height=device-height"
    />
    <style>
      body, #rpg {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      /* Fix dialog speaker name being clipped by overflow:hidden on parent */
      .rpg-ui-dialog-layer {
        overflow: visible !important;
      }
      .rpg-ui-dialog-container {
        overflow: visible !important;
      }
    </style>
  </head>
  <body>
    <div id="rpg"></div>
  </body>
</html>
