<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;overflow:hidden;font-family:'Courier New',monospace;color:#ccc;user-select:none}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;pointer-events:none;z-index:10}
#topBar{display:flex;align-items:center;padding:5px 10px;background:rgba(0,0,0,0.8);border-bottom:2px solid #444;gap:12px;font-size:13px}
#topBar span{white-space:nowrap}.sp{flex:1}
#controls-hint{position:absolute;bottom:0;left:0;right:0;padding:4px 12px;background:rgba(0,0,0,0.7);border-top:1px solid #444;font-size:11px;color:#888;z-index:10;text-align:center;pointer-events:none}
{{style_overrides}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div id="topBar"><span id="title-label">{{title}}</span><span class="sp"></span><span id="hud-info"></span></div></div>
<div id="controls-hint">{{controls}}</div>
<script>
{{library_canvas_engine}}
// ── {{title}} — Game Logic ──
// Populate this section with game-specific code.
// Reference pattern: marco-polo for Canvas 2D exploration games.
{{game_script}}
</script>
</body>
</html>
